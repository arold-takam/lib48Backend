services:
  # Service 1 : La Base de données
  db:
    image: postgres:15-alpine
    container_name: lib48-db
    environment:
      POSTGRES_USER: takus
      POSTGRES_PASSWORD: takus237
      POSTGRES_DB: lib48
    ports:
      - "5432:5432"

  # Service 2 : Ton Application Spring Boot
  app:
    build: .
    container_name: lib48-app
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      # On injecte les variables que tu as définies dans application.properties
      DATABASE_URL: jdbc:postgresql://db:5432/lib48
      DB_USER: takus
      DB_PASSWORD: takus237
      PORT: 8080
      # Ajoute tes clés Cloudinary ici pour le test
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      CLOUDINARY_KEY: ${CLOUDINARY_KEY}
      CLOUDINARY_SECRET: ${CLOUDINARY_SECRET}