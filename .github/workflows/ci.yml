name: Java CI with Maven

on:
  push:
    branches: [ "main", "master", "preprod", "test" ]
  pull_request:
    branches: [ "main", "master", "preprod", "test" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean verify

      # Affiche les logs d'erreurs en cas d'échec des tests
      - name: Show Test Errors
        if: failure()
        run: |
          echo "-------------------------------------------------------"
          echo "VOICI L'ERREUR RÉELLE EXTRAITE DES RAPPORTS MAVEN :"
          echo "-------------------------------------------------------"
          find target/surefire-reports -name "*.txt" -exec cat {} +
          echo "-------------------------------------------------------"