spring.application.name=lib48

spring.datasource.url=jdbc:postgresql://localhost:5432/lib48
spring.datasource.username=takus
spring.datasource.password=takus237
spring.datasource.driver-class-name=org.postgresql.Driver
#spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.open-in-view=false

server.servlet.context-path= /api

#dossier de stockage des images
#taille max des fichiers uploadés (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Activer la conversion des paramètres de formulaire
spring.http.converters.preferred-json-mapper=jackson

# Désactiver le traitement des JSON dans les multipart (si nécessaire)
spring.servlet.multipart.resolve-lazily=false

# Logging détaillé pour le debugging
logging.level.com.k48.lib48=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.multipart=DEBUG
logging.level.org.apache.tomcat=DEBUG
logging.level.org.hibernate=INFO

# File upload settings
spring.servlet.multipart.enabled=true

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha

#Debugging
debug=true