spring.application.name=lib48

# Base de donnees
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/lib48}
spring.datasource.username=${DB_USER:takus}
spring.datasource.password=${DB_PASSWORD:takus237}
spring.datasource.driver-class-name=org.postgresql.Driver

# URLs
base_.url=${APP_URL:http://localhost:8080}

#Dynamique port
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto= update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuration du serveur
server.servlet.context-path= /api

# Exposer le point de sante pour le monitoring et le deploiement
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Configuration JPA
spring.jpa.open-in-view=false

#dossier de stockage des images
#taille max des fichiers uploades (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Activer la conversion des parametres de formulaire
spring.http.converters.preferred-json-mapper=jackson

# Desactiver le traitement des JSON dans les multipart (si necessaire)
spring.servlet.multipart.resolve-lazily=false

# Logging detaille pour le debugging
logging.level.com.k48.lib48=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.multipart=DEBUG
logging.level.org.apache.tomcat=DEBUG
logging.level.org.hibernate=INFO

# File upload settings
spring.servlet.multipart.enabled=true
project.poster=uploads/
base.url=http://localhost:8080

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha

#Debugging
debug=true

# Cloudinary (Securite critique)
cloudinary.cloud_name=${CLOUDINARY_NAME:votre_nom_par_defaut}
cloudinary.api_key=${CLOUDINARY_KEY:votre_cle_par_defaut}
cloudinary.api_secret=${CLOUDINARY_SECRET:JxNqhUaVj0Ulo2kVzYfj4LygZQw}